name: Test

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.mjs"
      - "**.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**.js"
      - "**.mjs"
      - "**.json"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: npm test
